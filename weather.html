<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="weather.js" defer></script>
</head>
<body class="border border-primary">
    <div class="container" >
        <h1 class=text-primary>WEATHER APP</h1>
        <label for="city">Enter your city &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
        <input type="text" name="city" id="city"><br><br>
        <input type="button" id="check" class="btn btn-primary" onclick="check()" value="Check weather">
        <br><br>
        
        <h3 id="cityname"  style="display:none"></h3>
        <p id="temperature"  style="display:none"></p>
        <p id="description"  style="display:none"></p>
        <p id="windspeed"  style="display:none"></p>
        <img id="icon"  style="display:none">
        <p class="text-danger"id="error" style="display:none"></p>
    </div>
    
</body>
</html>
